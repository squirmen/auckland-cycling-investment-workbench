name: Pages

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.16"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Read pinned data-asset contract
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(jq -r '.releaseTag // empty' .github/pages-release.json)"
          asset_name="$(jq -r '.assetName // empty' .github/pages-release.json)"
          asset_sha256="$(jq -r '.sha256 // empty' .github/pages-release.json)"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Pages is locked: set a semantic releaseTag in .github/pages-release.json." >&2
            exit 1
          fi
          if [[ ! "$asset_name" =~ ^[A-Za-z0-9._-]+\.tar\.gz$ ]]; then
            echo "Pages is locked: set a single safe .tar.gz assetName." >&2
            exit 1
          fi
          if [[ ! "$asset_sha256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Pages is locked: set the verified lowercase SHA-256 for the release asset." >&2
            exit 1
          fi
          {
            echo "CIW_RELEASE_TAG=$release_tag"
            echo "CIW_ASSET_NAME=$asset_name"
            echo "CIW_ASSET_SHA256=$asset_sha256"
          } >> "$GITHUB_ENV"
      - name: Download the pinned release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ciw-release"
          gh release download "$CIW_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CIW_ASSET_NAME" \
            --dir "$RUNNER_TEMP/ciw-release"
          test -f "$RUNNER_TEMP/ciw-release/$CIW_ASSET_NAME"
      - name: Verify and unpack browser data
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ciw-release/$CIW_ASSET_NAME"
          printf '%s  %s\n' "$CIW_ASSET_SHA256" "$archive" | sha256sum --check --strict
          if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected." >&2
            exit 1
          fi
          if tar -tzf "$archive" | grep -Ev '^data(/|$)' | grep -q .; then
            echo "The release asset may contain only the data/ tree." >&2
            exit 1
          fi
          if tar -tvzf "$archive" | awk '{print substr($1, 1, 1)}' | grep -Ev '^[-d]$' | grep -q .; then
            echo "Only regular files and directories are permitted in the Pages data asset." >&2
            exit 1
          fi
          unpacked_bytes="$(tar -tvzf "$archive" | awk '{total += $3} END {print total + 0}')"
          file_count="$(tar -tzf "$archive" | wc -l | tr -d ' ')"
          if (( unpacked_bytes > 2147483648 || file_count > 10000 )); then
            echo "The Pages data asset exceeds the 2 GiB or 10,000-entry safety limit." >&2
            exit 1
          fi
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C web/public
          test -f web/public/data/manifest.json
      - name: Install locked analysis environment
        run: uv sync --locked --python 3.11.16
      - name: Validate the exported data
        run: |
          uv run --locked --no-sync ciw validate --config configs/auckland.yml --config-only --web
      - name: Install locked client dependencies
        working-directory: web
        run: npm ci
      - name: Build client
        working-directory: web
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
