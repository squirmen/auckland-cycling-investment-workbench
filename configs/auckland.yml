pipeline:
  resume: true
  stages:
    - name: source-inventory
      version: "2"
      depends_on: []
      options:
        profile: auckland-v1
    - name: prepare-demand
      version: "4"
      depends_on: [source-inventory, build-topology]
      options:
        profile: auckland-v1
    - name: build-topology
      version: "3"
      depends_on: [source-inventory]
      options:
        profile: auckland-v1
    - name: assign-routes
      version: "6"
      depends_on: [prepare-demand, build-topology]
      options:
        profile: auckland-v1
    - name: generate-candidates
      version: "5"
      depends_on: [assign-routes, build-topology]
      options:
        profile: auckland-v1
    - name: evaluate-portfolios
      version: "5"
      depends_on: [assign-routes, generate-candidates]
      options:
        profile: auckland-v1
    - name: appraisal-uncertainty-validation
      version: "4"
      depends_on: [evaluate-portfolios, assign-routes, build-topology]
      options:
        profile: auckland-v1
    - name: export-outputs
      version: "4"
      depends_on: [build-topology, assign-routes, generate-candidates, evaluate-portfolios, appraisal-uncertainty-validation]
      options:
        profile: auckland-v1
    - name: export-web
      version: "3"
      depends_on: [export-outputs]
      options:
        profile: auckland-v1

export:
  public_data_dir: web/public/data
  manifest_filename: manifest.json
  layer_filenames:
    cells: cells.geojson
    network: network.geojson
    candidates: candidates.geojson
    programmes: programmes.geojson
    counters: counters.geojson
    safety: safety.geojson

parameters:
  network:
    analysis_bounds_wgs84: [174.25, -37.35, 175.35, -36.05]
    honour_oneway: true
    maximum_snap_distance_m: 1800
    candidate_matching: exact_edge_ids
    low_stress_threshold_lts: 2
    comfort_impedance:
      lts_1: 1.0
      lts_2: 1.25
      lts_3: 1.8
      lts_4: 3.0
      uphill_gradient_weight: 4.0
      downhill_gradient_weight: 0.5
      tunnel_multiplier: 1.25
      bridge_multiplier: 1.05
  routing:
    od_selection: stratified_probability_sample
    sampling:
      design: stratified_simple_random_without_replacement
      stratum: source_cell_id
      records_per_stratum_by_purpose:
        commute: 1
        school: 3
        everyday: 3
        transit: 3
      seed: 20260301
      estimator: Horvitz-Thompson
    chunk_size: 250
    bicycle_speed_kph: 15
    maximum_bicycle_lts: 4
    unmapped_edge_multiplier: 3.0
    plausible_paths: 5
    maximum_cost_ratio: 1.5
    maximum_detour_ratio: 1.5
    maximum_shared_edge_ratio: 0.95
    alternative_penalty_multiplier: 2.0
    maximum_alternative_attempts: 4
    engine_link_tolerance_m: 1.0
    path_size_logit_cost_scale: 0.002
    path_size_coefficient: 1.0
  demand:
    propensity:
      model: pct_2020_published_manual_equations
      maximum_distance_km: 30
    confidentiality:
      method: joint-fixed-random-rounding-base-3-intervals
      numeric_maximum_error: 2
      suppression_upper: 5
      joint_constraint: bicycle_not_greater_than_eligible
      origin_margin_role: soft_bounded_evidence_different_universe
      destination_margin_role: soft_bounded_evidence_different_universe
    disaggregation:
      origin_weight: sa1_usually_resident_population
      destination_weight: sa2_employee_count_with_poi_fallback
      retain_intrazonal: true
      samples_per_od: 25
      seed: 20260301
    purpose_markets:
      school:
        maximum_distance_m: 10000
        distance_decay_m: 3000
        samples_per_school: 25
        seed: 20260301
        interpretation: population-distance allocation of observed roll, not observed cycling
      everyday:
        maximum_distance_m: 7500
        category_weights:
          civic: 1
          grocery: 1
          health: 1
          recreation: 1
          retail: 1
          services: 1
        interpretation: person-equivalent opportunity access index, not daily trips
      transit:
        maximum_distance_m: 5000
        interpretation: person-equivalent access to nearest major node, not patronage
  demand_response:
    minimum_probability: 0.00001
    cost_elasticity:
      distribution: triangular
      lower: 0.5
      mode: 1.0
      upper: 2.0
    target_scenario:
      target_share: 0.08
      distance_decay:
        neutral_through_km: 12
        exponential_scale_km: 5
  candidates:
    minimum_length_m: 100
    maximum_length_m: 9000
    matching: exact_edge_ids
    connectivity_max_lts: 2
    maximum_detour_ratio: 1.5
    screening_cost:
      currency: NZD
      price_base_year: 2021
      lower_nzd_per_m: 3000
      base_nzd_per_m: 6000
      upper_nzd_per_m: 12000
      evidence_status: provisional_screening_assumption
      interpretation: configurable corridor screening range, not a project cost estimate
    facility_matching:
